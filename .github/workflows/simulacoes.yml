name: Konaet - ciclos autonomos do laboratorio

on:
  push:
    branches: [main]
    paths:
      - 'matlab/**'
      - 'tests/**'
      - 'fortran/**'
      - 'systemverilog/**'
      - 'qsharp/**'
      - 'src/**'
      - 'models/**'
      - 'datasets/**'
      - 'hardware/icebreaker/**'
      - '*.m'
      - '.github/**'
      - 'integrated/evaluation-protocol.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
  workflow_dispatch:
    inputs:
      module:
        description: Modulo a executar manualmente
        type: choice
        options: [physics, xeno, offline, agent]
        default: physics
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash
env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

concurrency:
  group: konaet-laboratorio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  executar-modelos:
    name: Physics MATLAB Fortran RTL
    if: github.event_name != 'workflow_dispatch' || inputs.module == 'physics'
    runs-on: ubuntu-24.04
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
    steps:
      - uses: 7dsol3/konaet-sovereign-spec/infra/setup-ubuntu@441b0f1b92d606cfa4e56ef66f51d451428d7c9d
      - name: Baixar o repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Instalar compiladores Fortran e SystemVerilog
        run: |
          bash .github/scripts/publication-inputs.sh capture physics artifacts
          bash .github/scripts/install-tools.sh physics artifacts
          mkdir -p build artifacts

      - name: Compilar e executar o modelo Fortran
        run: |
          gfortran -std=f2008 -O2 fortran/free_wavepacket.f90 -o build/free_wavepacket
          ./build/free_wavepacket 0.7 1.2 0.8 artifacts/wave_fortran.dat

      - name: Simular o modulo SystemVerilog
        run: |
          iverilog -g2012 -s complex_mul_q15_demo_tb \
            -o build/complex_mul_demo \
            systemverilog/complex_mul_q15.sv \
            systemverilog/complex_mul_q15_demo_tb.sv
          vvp build/complex_mul_demo | tee artifacts/systemverilog.log

      - name: Preparar MATLAB
        uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2026b
          cache: true

      - name: Executar os modelos MATLAB em modo batch
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('matlab'); executar_pipeline(true)

      - name: Guardar os resultados da simulacao
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: resultados-do-laboratorio
          path: artifacts/
          if-no-files-found: error

      - name: Mostrar resultados no resumo do GitHub
        run: |
          {
            echo '## Realidade Quantica — execucao cientifica'
            echo
            echo '```text'
            cat artifacts/summary.txt
            echo '```'
            echo
            echo 'O painel PNG, a animacao GIF, a memoria do Konaet, os dados CSV, o arquivo MAT e a simulacao SystemVerilog estao em **Actions → Artifacts → resultados-do-laboratorio**.'
          } >> "$GITHUB_STEP_SUMMARY"

  xenoelement:
    if: github.event_name == 'workflow_dispatch' && inputs.module == 'xeno'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/xenoelement.yml
    secrets: inherit

  offline:
    if: github.event_name == 'workflow_dispatch' && inputs.module == 'offline'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/offline.yml
    secrets: inherit

  agent:
    if: github.event_name == 'workflow_dispatch' && inputs.module == 'agent'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/integrated.yml
    secrets: inherit

  publicar:
    needs: executar-modelos
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-results.yml
    with:
      module: physics
      artifact: resultados-do-laboratorio
    secrets: inherit
