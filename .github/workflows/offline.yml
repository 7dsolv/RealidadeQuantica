name: KONAET - sistema offline e PCB

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'matlab/tiny/**'
      - 'models/anomalynet/**'
      - 'fortran/tiny_anomalynet.f90'
      - 'executar_offline.m'
      - '.github/workflows/offline.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'matlab/tiny/**'
      - 'models/anomalynet/**'
      - 'fortran/tiny_anomalynet.f90'
      - 'executar_offline.m'
      - '.github/workflows/offline.yml'

permissions:
  contents: read

concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar compilador e KiCad nativo
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gfortran kicad
          mkdir -p build artifacts/offline
          cp models/anomalynet/LICENSE.txt artifacts/offline/AnomalyNet-LICENSE.txt
          cp models/anomalynet/NOTICE.txt artifacts/offline/AnomalyNet-NOTICE.txt
          gfortran -std=f2008 -Wall -Wextra -fcheck=all -O2 \
            fortran/tiny_anomalynet.f90 -o build/tiny_anomalynet
          kicad-cli version | tee artifacts/offline/kicad-version.txt
          kicad-cli version | grep -Eq '^10\.'
      - uses: matlab-actions/setup-matlab@v3
      - name: Inferir, comparar e gerar placa em MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: executar_offline(true);
      - name: Validar PCB e exportar camadas no KiCad
        run: |
          set -euo pipefail
          board='artifacts/offline/board/x01-carrier.kicad_pcb'
          kicad-cli pcb drc --format json --severity-all \
            --output artifacts/offline/board/kicad-report.json "$board"
          kicad-cli pcb drc --format json --severity-error --exit-code-violations \
            --output artifacts/offline/board/kicad-errors.json "$board"
          jq -e 'has("unconnected_items") and (.unconnected_items | type == "array") and (.unconnected_items | length == 0)' artifacts/offline/board/kicad-report.json
          mkdir -p artifacts/offline/board/layers
          kicad-cli pcb export svg --mode-multi --layers F.Cu,B.Cu,F.SilkS,Edge.Cuts \
            --output artifacts/offline/board/layers/ "$board"
          kicad-cli pcb render --width 1600 --height 1000 --quality high \
            --background opaque --rotate=-45,0,35 \
            --define-var "KIPRJMOD=$PWD/artifacts/offline/board" \
            --output artifacts/offline/board/x01-kicad.png "$board"
      - name: Resumir verificacoes reais
        run: |
          {
            echo '## KONAET / sistema offline + placa conceitual'
            echo 'AnomalyNet: Eoin Jordan, Apache-2.0. Avaliacao propria em dados sinteticos.'
            jq '{passed,total,accuracy_fp32,accuracy_int8,decision_agreement,model_int8_payload_bytes,mcu_latency,device_integration}' artifacts/offline/tiny-report.json
            jq '{passed,total,nominal_tau_s,nominal_cutoff_Hz,energy_balance_residual_J,status}' artifacts/offline/board/board-report.json
            jq '{errors: [.violations[] | select(.severity == "error")] | length, warnings: [.violations[] | select(.severity == "warning")] | length, unconnected: .unconnected_items | length}' artifacts/offline/board/kicad-report.json
            echo 'DRC nao demonstra fabricabilidade, compatibilidade ADC ou seguranca de um equipamento.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: konaet-offline
          path: |
            artifacts/offline/
            !artifacts/offline/corrupt-fixture/
            !artifacts/offline/board/animation-frame.png
          if-no-files-found: warn
          retention-days: 30

  publicar:
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: konaet-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Autenticar App quando configurada
        if: vars.KONAET_APP_CLIENT_ID != ''
        id: app
        uses: 7dsolv/konaet-bot@488671c980ae433a4714de3321d10e58415cf9d0 # v1.1.1
        with:
          client-id: ${{ vars.KONAET_APP_CLIENT_ID }}
          private-key: ${{ secrets.KONAET_APP_PRIVATE_KEY }}
          expected-slug: konaet
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          ref: main
      - uses: actions/download-artifact@v8
        with:
          name: konaet-offline
          path: artifacts/offline
      - name: Publicar placa, modelo 3D e evidencias
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_LOGIN: ${{ steps.app.outputs.bot-login }}
        run: |
          set -euo pipefail
          identity="$(gh api --hostname github.com '/users/konaet[bot]' --jq '[.id,.login,.type] | @tsv')"
          [ "$identity" = $'352182232\tkonaet[bot]\tBot' ]
          mkdir -p assets/offline hardware/x01-carrier/models hardware/x01-carrier/layers
          for file in tiny-report.json tiny-predictions.csv tiny-evaluation.png \
            anomalynet-int8.bin quantization.json signal-samples.csv signal-decisions.csv \
            signal-chain.json signal-chain.png; do
            cp "artifacts/offline/$file" "assets/offline/$file"
            git add -- "assets/offline/$file"
          done
          cp models/anomalynet/LICENSE.txt assets/offline/AnomalyNet-LICENSE.txt
          cp models/anomalynet/NOTICE.txt assets/offline/AnomalyNet-NOTICE.txt
          git add -- assets/offline/AnomalyNet-LICENSE.txt assets/offline/AnomalyNet-NOTICE.txt
          for file in board-source.json board-report.json bom.csv x01-rc.cir \
            x01-circuit.svg x01-carrier.kicad_pcb x01-carrier.stl x01-board.png \
            x01-board-motion.gif x01-kicad.png rc-response.csv rc-response.png kicad-report.json kicad-errors.json; do
            cp "artifacts/offline/board/$file" "hardware/x01-carrier/$file"
            git add -- "hardware/x01-carrier/$file"
          done
          for ref in J1 J2 J3 R1 R2 C1 C2 C3; do
            cp "artifacts/offline/board/models/$ref.wrl" "hardware/x01-carrier/models/$ref.wrl"
            git add -- "hardware/x01-carrier/models/$ref.wrl"
          done
          cp artifacts/offline/board/layers/*.svg hardware/x01-carrier/layers/
          git add -- hardware/x01-carrier/layers
          if git diff --cached --quiet; then exit 0; fi
          if [ -n "$APP_LOGIN" ]; then
            [ "$APP_LOGIN" = 'konaet[bot]' ]
            committer='konaet[bot]'
            email='352182232+konaet[bot]@users.noreply.github.com'
          else
            committer='github-actions[bot]'
            email='41898282+github-actions[bot]@users.noreply.github.com'
          fi
          GIT_AUTHOR_NAME='konaet[bot]' GIT_AUTHOR_EMAIL='352182232+konaet[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME="$committer" GIT_COMMITTER_EMAIL="$email" \
            git commit -m 'KONAET publica sistema offline e placa 3D verificados [skip ci]'
          git push origin HEAD:main
          printf 'Artefatos offline publicados com autoria KONAET; executor: %s.\n' "$committer" >> "$GITHUB_STEP_SUMMARY"
