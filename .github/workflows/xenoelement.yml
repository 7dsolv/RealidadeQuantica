name: KONAET XENOELEMENT X-01

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'matlab/**'
      - 'tests/**'
      - 'fortran/**'
      - 'systemverilog/**'
      - 'qsharp/**'
      - 'src/**'
      - 'models/**'
      - 'datasets/**'
      - 'hardware/icebreaker/**'
      - '*.m'
      - '.github/**'
      - 'integrated/evaluation-protocol.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
  schedule:
    - cron: '43 5 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash
env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

concurrency:
  group: xeno-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    name: Xenoelement MATLAB and RTL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: 7dsol3/konaet-sovereign-spec/infra/setup-ubuntu@441b0f1b92d606cfa4e56ef66f51d451428d7c9d
      - name: Compilar referencias independentes
        run: |
          set -euo pipefail
          bash .github/scripts/publication-inputs.sh capture xeno artifacts/xeno
          bash .github/scripts/install-tools.sh xeno artifacts/xeno
          mkdir -p build artifacts/xeno
          gfortran -std=f2008 -Wall -Wextra -fcheck=all -O2 \
            fortran/xeno_optics_reference.f90 -o build/xeno_optics
          ./build/xeno_optics artifacts/xeno/optics_fortran.csv
          iverilog -g2012 -s xeno_fusion_tb -o build/xeno_fusion \
            systemverilog/xeno_fusion.sv systemverilog/xeno_fusion_tb.sv
          vvp build/xeno_fusion | tee artifacts/xeno/fpga.log
      - uses: matlab-actions/setup-matlab@f9e43010f1ae678f7cfa0542fe2a4f60f7d1ad8d # v3
        with:
          release: R2026b
          cache: true
      - name: Calcular, testar e desenhar em MATLAB
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('matlab/xeno'); executar_xeno(true,true);
      - name: Verificar app MATLAB
        uses: matlab-actions/run-command@bfa857648f4895aa98a446fe41c85e0788421ed5 # v3
        with:
          command: addpath('tests'); test_xeno_app(fullfile(pwd,'artifacts','xeno'));
      - name: Resumir evidencias
        run: |
          {
            echo '## KONAET XENOELEMENT X-01'
            echo 'Prototipo computacional. Dados sinteticos; material fisico nao fabricado.'
            echo '```text'
            cat artifacts/xeno/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: xenoelement-x01
          path: artifacts/xeno/
          if-no-files-found: warn
          retention-days: 30

  publicar:
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-results.yml
    with:
      module: xeno
      artifact: xenoelement-x01
    secrets: inherit
