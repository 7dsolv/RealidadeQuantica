name: KONAET XENOELEMENT X-01

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'matlab/xeno/**'
      - 'fortran/xeno_optics_reference.f90'
      - 'systemverilog/xeno_*'
      - 'tests/test_xeno.m'
      - 'abrir_xenoelement.m'
      - '.github/workflows/xenoelement.yml'
  pull_request:
    paths:
      - 'matlab/xeno/**'
      - 'fortran/xeno_optics_reference.f90'
      - 'systemverilog/xeno_*'
      - 'tests/test_xeno.m'
      - 'abrir_xenoelement.m'
      - '.github/workflows/xenoelement.yml'
  schedule:
    - cron: '43 5 * * *'

permissions:
  contents: read

concurrency:
  group: xeno-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compilar referencias independentes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y gfortran iverilog
          mkdir -p build artifacts/xeno
          gfortran -std=f2008 -Wall -Wextra -fcheck=all -O2 \
            fortran/xeno_optics_reference.f90 -o build/xeno_optics
          ./build/xeno_optics artifacts/xeno/optics_fortran.csv
          iverilog -g2012 -s xeno_fusion_tb -o build/xeno_fusion \
            systemverilog/xeno_fusion.sv systemverilog/xeno_fusion_tb.sv
          vvp build/xeno_fusion | tee artifacts/xeno/fpga.log
      - uses: matlab-actions/setup-matlab@v3
      - name: Calcular, testar e desenhar em MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab/xeno'); executar_xeno(true,true);
      - name: Verificar app MATLAB
        uses: matlab-actions/run-command@v3
        with:
          command: set(groot,'defaultFigureVisible','off'); f=abrir_xenoelement(true); assert(isgraphics(f) && isstruct(f.UserData) && isfield(f.UserData,'bragg_nm')); close(f);
      - name: Resumir evidencias
        run: |
          {
            echo '## KONAET XENOELEMENT X-01'
            echo 'Prototipo computacional. Dados sinteticos; material fisico nao fabricado.'
            echo '```text'
            cat artifacts/xeno/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xenoelement-x01
          path: artifacts/xeno/
          if-no-files-found: warn
          retention-days: 30

  publicar:
    needs: validar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Autenticar App quando configurada
        if: vars.KONAET_APP_CLIENT_ID != ''
        id: app
        uses: 7dsolv/konaet-bot@488671c980ae433a4714de3321d10e58415cf9d0 # v1.1.1
        with:
          client-id: ${{ vars.KONAET_APP_CLIENT_ID }}
          private-key: ${{ secrets.KONAET_APP_PRIVATE_KEY }}
          expected-slug: konaet
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: xenoelement-x01
          path: artifacts/xeno
      - name: Publicar graficos e evidencias calculadas
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_LOGIN: ${{ steps.app.outputs.bot-login }}
        run: |
          set -euo pipefail
          identity="$(gh api --hostname github.com '/users/konaet[bot]' --jq '[.id,.login,.type] | @tsv')"
          [ "$identity" = $'352182232\tkonaet[bot]\tBot' ]
          mkdir -p assets/xeno
          for file in x01-dashboard.png x01-motion.gif x01-motion-preview.png \
            x01-architecture.png x01-architecture.svg evidence.json parameters.json \
            test-report.json visual-manifest.json; do
            cp "artifacts/xeno/$file" "assets/xeno/$file"
            git add -- "assets/xeno/$file"
          done
          if git diff --cached --quiet; then exit 0; fi
          if [ -n "$APP_LOGIN" ]; then
            [ "$APP_LOGIN" = 'konaet[bot]' ]
            committer='konaet[bot]'
            email='352182232+konaet[bot]@users.noreply.github.com'
          else
            committer='github-actions[bot]'
            email='41898282+github-actions[bot]@users.noreply.github.com'
          fi
          GIT_AUTHOR_NAME='konaet[bot]' GIT_AUTHOR_EMAIL='352182232+konaet[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME="$committer" GIT_COMMITTER_EMAIL="$email" \
            git commit -m 'KONAET atualiza simulacao X-01 e evidencias [skip ci]'
          git push origin HEAD:main
          printf 'Resultados sinteticos publicados com autoria KONAET; executor: %s.\n' "$committer" >> "$GITHUB_STEP_SUMMARY"
