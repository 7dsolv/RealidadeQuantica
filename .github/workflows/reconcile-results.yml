name: KONAET - atualizar propostas validadas
on:
  workflow_dispatch:
  schedule:
    - cron: '8,38 * * * *'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  update:
    if: vars.KONAET_APP_CLIENT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: konaet-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: 7dsolv/konaet-bot@7506bfda2a6fb503e0457132e149f560fd83295a # validated v1.3.1 source
        id: app
        with:
          client-id: ${{ vars.KONAET_APP_CLIENT_ID }}
          private-key: ${{ secrets.KONAET_APP_PRIVATE_KEY }}
          expected-slug: konaet
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Atualizar somente propostas cujos inputs continuam validos
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash .github/scripts/reconcile-publications.sh
